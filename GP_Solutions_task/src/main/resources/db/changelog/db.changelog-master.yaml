databaseChangeLog:
  - changeSet:
      id: 1-create-hotel-schema
      author: ai
      changes:
        - createTable:
            tableName: hotel
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: brand
                  type: VARCHAR(255)
              - column:
                  name: address_house_number
                  type: VARCHAR(50)
              - column:
                  name: address_street
                  type: VARCHAR(255)
              - column:
                  name: address_city
                  type: VARCHAR(100)
              - column:
                  name: address_country
                  type: VARCHAR(100)
              - column:
                  name: address_post_code
                  type: VARCHAR(20)
              - column:
                  name: contacts_phone
                  type: VARCHAR(50)
              - column:
                  name: contacts_email
                  type: VARCHAR(255)
              - column:
                  name: arrival_check_in
                  type: VARCHAR(10)
              - column:
                  name: arrival_check_out
                  type: VARCHAR(10)

        - createTable:
            tableName: hotel_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amenity
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: hotel_amenities
            baseColumnNames: hotel_id
            referencedTableName: hotel
            referencedColumnNames: id
            constraintName: fk_hotel_amenities_hotel

  - changeSet:
      id: 2-seed-sample-hotel
      author: ai
      changes:
        - insert:
            tableName: hotel
            columns:
              - column:
                  name: id
                  valueNumeric: 1
              - column:
